name: PortDeck Builds

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Allow uploading build artifacts (APK, Wasm).
permissions:
  contents: read

# This repo builds the native PortDeck app (Kotlin Multiplatform / Compose Multiplatform):
# an Android APK and a Kotlin/Wasm distribution. The Next.js web app is intentionally excluded.
# The preview engine sources live in multiplatform/engine and bundle into the
# committed engine.js / host.js assets; the engine job keeps them in sync.

jobs:
  engine:
    name: Verify preview engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: multiplatform/engine/package-lock.json

      - name: Install engine dependencies
        working-directory: multiplatform/engine
        run: npm ci --no-audit --no-fund

      - name: Run engine smoke tests
        working-directory: multiplatform/engine
        run: npm test

      - name: Rebuild engine and check the committed bundles are in sync
        working-directory: multiplatform/engine
        run: |
          npm run build
          git diff --exit-code -- ../composeApp/src/androidMain/assets/engine/engine.js ../composeApp/src/wasmJsMain/resources/host.js

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          GRADLE_VERSION=8.11.1
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Assemble debug APK
        working-directory: multiplatform
        run: gradle :composeApp:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: portdeck-android
          path: multiplatform/composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  wasm:
    name: Build Wasm distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Gradle
        run: |
          GRADLE_VERSION=8.11.1
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Build Wasm
        working-directory: multiplatform
        run: gradle :composeApp:wasmJsBrowserDistribution --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
      - name: Upload Wasm
        uses: actions/upload-artifact@v4
        with:
          name: portdeck-wasm
          path: multiplatform/composeApp/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
