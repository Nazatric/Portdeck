name: PortDeck Builds

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch so queued CI does not pile up.
concurrency:
  group: portdeck-${{ github.ref }}
  cancel-in-progress: true

# PortDeck is a native Android app (Kotlin Multiplatform / Compose Multiplatform).
# The preview engine sources live in multiplatform/engine and bundle into the committed
# engine.js asset; the engine job keeps it in sync. Formatting is enforced by prettier
# (engine) and spotless/ktlint (app).

jobs:
  engine:
    name: Verify preview engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: multiplatform/engine/package-lock.json

      - name: Install engine dependencies
        working-directory: multiplatform/engine
        run: npm ci --no-audit --no-fund

      - name: Check formatting (prettier)
        working-directory: multiplatform/engine
        run: npm run format:check

      - name: Run engine smoke tests
        working-directory: multiplatform/engine
        run: npm test

      - name: Rebuild engine and check the committed bundle is in sync
        working-directory: multiplatform/engine
        run: |
          npm run build
          git diff --exit-code -- ../composeApp/src/androidMain/assets/engine/engine.js

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        run: |
          GRADLE_VERSION=8.11.1
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      # Caches the Gradle user home (dependency cache, build cache) between runs.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Format Kotlin sources with spotless/ktlint
        working-directory: multiplatform
        run: |
          set +e
          gradle :composeApp:spotlessApply --no-daemon -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" > /tmp/spotless.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            hint=$(grep -E -i 'what went wrong|unresolved|could not|failed|exception|error|non-zero|Lint error|\.kt[: ]' /tmp/spotless.log | sed 's/[%\r]//g' | tr '\n' '|' | tail -c 1600)
            echo "::error::spotlessApply exit $code :: $hint"
            exit $code
          fi

      - name: Warn if formatting drift snuck in
        continue-on-error: true
        run: |
          if ! git diff --exit-code; then
            stat=$(git diff --stat | tr '\n' '|' | tail -c 600)
            patch=$(git diff -- '*.kt' | sed 's/[%\r]//g' | tr '\n' '|' | tail -c 2800)
            echo "::warning::spotless reformatted files :: $stat :: $patch"
          fi

      - name: Assemble debug APK
        working-directory: multiplatform
        run: |
          set +e
          gradle :composeApp:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" > /tmp/assemble.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            hint=$(grep -E -i 'what went wrong|unresolved|could not|failed|exception|error:|error |e: ' /tmp/assemble.log | sed 's/[%\r]//g' | tr '\n' '|' | tail -c 1800)
            echo "::error::assembleDebug exit $code :: $hint"
            exit $code
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: portdeck-android
          path: multiplatform/composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
