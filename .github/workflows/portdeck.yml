name: PortDeck Builds

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch so queued CI does not pile up.
concurrency:
  group: portdeck-${{ github.ref }}
  cancel-in-progress: true

# PortDeck is a native Android app (Kotlin Multiplatform / Compose Multiplatform).
# The preview engine sources live in multiplatform/engine and bundle into the committed
# engine.js asset; the engine job keeps it in sync. Formatting is enforced by prettier
# (engine) and spotless/ktlint (app).

jobs:
  engine:
    name: Verify preview engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: multiplatform/engine/package-lock.json

      - name: Install engine dependencies
        working-directory: multiplatform/engine
        run: npm ci --no-audit --no-fund

      - name: Check formatting (prettier)
        working-directory: multiplatform/engine
        run: npm run format:check

      - name: Run engine smoke tests
        working-directory: multiplatform/engine
        run: npm test

      - name: Rebuild engine and check the committed bundle is in sync
        working-directory: multiplatform/engine
        run: |
          npm run build
          git diff --exit-code -- ../composeApp/src/androidMain/assets/engine/engine.js

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Format Kotlin sources with spotless/ktlint
        working-directory: multiplatform
        run: ./gradlew :composeApp:spotlessApply --no-daemon -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

      - name: Warn if formatting drift snuck in
        continue-on-error: true
        run: |
          git diff --exit-code || echo "::warning::Kotlin sources were not spotless-formatted; run ./gradlew :composeApp:spotlessApply locally."

      - name: Assemble debug APK
        working-directory: multiplatform
        run: ./gradlew :composeApp:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: portdeck-android
          path: multiplatform/composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
